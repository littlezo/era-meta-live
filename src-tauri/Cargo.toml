[workspace]
resolver = "3"
members = [".", "platforms", "platforms/bilibili", "platforms/douyin", "platforms/douyu", "platforms/huya", "platforms/shared"]

[workspace.dependencies]
platforms = { path = "platforms" }
bilibili = { path = "platforms/bilibili" }
douyin = { path = "platforms/douyin" }
douyu = { path = "platforms/douyu" }
huya = { path = "platforms/huya" }
shared = { path = "platforms/shared" }

[package]
name = "era-meta-live"
version = "2.4.1"
description = "Era Meta Live App"
authors = ["@长久同学 <x@era-x.cn>"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "era_meta_live_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.5.3", features = [] }
prost-build = "0.12"

[dependencies]
tauri = { version = "2.9.5", features = ["macos-private-api", "devtools"] }
tauri-plugin-opener = "2.5.2"
tauri-plugin-updater = "2.9.0"
window-vibrancy = "0.7.1"
 serde = { version = "1.0", features = ["derive"] }
 serde_json = "1.0.148"
 md-5 = "0.10.6"
 deno_core = "0.288.0"
 regex = "1.12.2"
 tokio = { version = "1.48.0", features = ["full"] }
 tokio-tungstenite = { version = "0.20", features = ["native-tls"] }
 url = "2.5"
 native-tls = "0.2"
 rand = "0.8"
 futures-util = "0.3"
 urlencoding = "2.1.3"
 percent-encoding = "2.3"
 serde_urlencoded = "0.7"
 reqwest = { version = "0.11", features = ["json", "stream", "cookies", "brotli", "gzip", "blocking"] }
 actix-web = "4"
 actix-cors = "0.7"
 awc = { version = "3.8.1", features = ["tls-rustls-0_22"] }
 bytes = "1"
 log = "0.4"
 thiserror = "1.0"
 base64 = "0.21"
 anyhow = "1.0"
 once_cell = "1.21"
 hex = "0.4"
 http = "0.2" 
 # Huya TARS codec
 tars-stream = "0.1.1"
  
 # Force curl to use platform TLS (SecureTransport on macOS) and avoid OpenSSL linkage
 # Dependencies for Douyin Message
 prost = "0.12"
 prost-types = "0.12"
 flate2 = "1.1"
 lazy_static = "1.5.0"
 chrono = "0.4"
 
 specta = { version = "2.0.0-rc.22", features = ["serde", "derive", "function"] }
tauri-plugin-os = "2.3.2"
tauri-plugin-notification = "2.2.1"

tungstenite = { version = "0.21", features = ["native-tls"] }
 brotlic = "0.8"
 cookie = "0.18"
 html-escape = "0.2"
platforms = { path = "platforms" }

 [profile.dev]
 opt-level = 0          # 无优化
 debug = true           # 开启调试信息
 overflow-checks = true # 整数溢出检查
 incremental = true     # 启用增量编译

 [profile.release]
 panic = "abort"    # 崩溃时直接终止
 codegen-units = 1  # 一个接一个地编译包，这样编译器就可以更好地优化
 lto = true         # 启用链接到优化
 opt-level = 3      # 最大优化
 strip = true       # 删除调试符号
 debug = false      # 关闭调试信息
 incremental = true # 启用增量编译
