[package]
name = "douyin"
version = "0.1.0"
edition = "2021"
authors = ["@长久同学 <x@era-x.cn>", "@Era X Team <gorup@era-x.cn>"]
build = "build.rs"

[lib]
crate-type = ["staticlib", "cdylib", "lib"]

[build-dependencies]
prost-build = "0.12"

[dependencies]
shared = { path = "../shared" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
prost-serde = "0.3.0"

reqwest = { version = "0.11", features = ["json", "stream", "cookies", "brotli", "gzip", "blocking"] }
tokio-tungstenite = { version = "0.20", features = ["native-tls"] }
url = "2.5"
regex = "1.12.2"
md-5 = "0.10.6"
base64 = "0.21"
hex = "0.4"
percent-encoding = "2.3"
serde_urlencoded = "0.7"
thiserror = "1.0"
anyhow = "1.0"
once_cell = "1.21"
lazy_static = "1.5.0"
prost = "0.12"
prost-types = "0.12"
tokio = { version = "1.48.0", features = ["full"] }
log = "0.4"
rand = "0.8"
flate2 = "1.1"
urlencoding = "2.1.3"
native-tls = "0.2"
brotlic = "0.8"
chrono = "0.4"
deno_core = "0.288.0"

async-trait = "0.1.80"
html-escape = "0.2"
futures-util = "0.3.31"
