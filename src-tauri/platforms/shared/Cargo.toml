[package]
name = "shared"
version = "0.1.0"
edition = "2021"
authors = ["@长久同学 <x@era-x.cn>", "@Era X Team <gorup@era-x.cn>"]

[lib]
crate-type = ["staticlib", "cdylib", "lib"]

[build-dependencies]
prost-build = "0.12"

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0.148"
tokio = { version = "1.48.0", features = ["full"] }
prost = "0.12"
prost-types = "0.12"
reqwest = { version = "0.11", features = ["json", "stream", "cookies", "brotli", "gzip", "blocking"] }
url = "2.5"
regex = "1.12.2"
thiserror = "1.0"
anyhow = "1.0"
once_cell = "1.21"
cookie = "0.18"
log = "0.4"
tracing = { version = "0.1", features = ["log"] }
tracing-log = "0.2"
tracing-subscriber = { version = "0.3", features = ["env-filter", "local-time", "time"] }
console-subscriber = { version = "0.4.1", optional = true }
chrono = "0.4"
specta = { version = "2.0.0-rc.22", features = ["serde", "derive", "function"] }
async-trait = "0.1.80"

[dev-dependencies]
mockito = "1.5"
tokio-test = "0.4"
serde_test = "1.0"
assert-json-diff = "2.0"
tracing-test = "0.2"
