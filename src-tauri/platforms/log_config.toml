# 日志系统配置文件

# 根级别配置
[root]
level = "info"
appenders = ["console", "file"]

# 控制台输出
[appenders.console]
type = "console"
encoder.type = "pattern"
encoder.pattern = "%d{%Y-%m-%d %H:%M:%S%.3f} [%level] [%thread] [%platform] [%module] %message%n"

# 文件输出（按天轮转）
[appenders.file]
type = "rolling_file"
path = "logs/platforms-{date}.log"
encoder.type = "pattern"
encoder.pattern = "%d{%Y-%m-%d %H:%M:%S%.3f} [%level] [%thread] [%platform] [%module] %message%n"

# 按天轮转策略
[appenders.file.policy]
type = "compound"

# 触发策略：每天午夜触发
[appenders.file.policy.trigger]
type = "cron"
expression = "0 0 0 * * *"

# 轮转策略：按日期命名文件
[appenders.file.policy.roller]
type = "fixed_window"
pattern = "logs/platforms-{}.log.gz"
base = 0
count = 7  # 保留最近7天的日志

# 按平台配置日志级别
[loggers.bilibili]
level = "info"
appenders = ["file"]
additive = false

[loggers.douyin]
level = "info"
appenders = ["file"]
additive = false

[loggers.douyu]
level = "info"
appenders = ["file"]
additive = false

[loggers.huya]
level = "info"
appenders = ["file"]
additive = false

# 按模块配置日志级别
[loggers.shared]
level = "debug"
appenders = ["file"]
additive = false
